<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'artesaos/cadastro.css' %}">
    <meta charset="UTF-8">
    <title>Cadastrar Artesão</title>
</head>

<body>

    <h1>Cadastrar Artesão</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Cadastrar</button>
    </form>
<script>
    const telefone = document.getElementById('telefone');

    telefone.addEventListener('input', function () {
        let valor = telefone.value.replace(/\D/g, '');

        if (valor.length > 11) {
            valor = valor.substring(0, 11);
        }

        if (valor.length > 6) {
            valor = valor.replace(
                /^(\d{2})(\d{5})(\d{0,4}).*/,
                '($1) $2-$3'
            );
        } else if (valor.length > 2) {
            valor = valor.replace(
                /^(\d{2})(\d{0,5})/,
                '($1) $2'
            );
        } else if (valor.length > 0) {
            valor = valor.replace(
                /^(\d{0,2})/,
                '($1'
            );
        }

        telefone.value = valor;
    });
</script>
</body>
</html>
